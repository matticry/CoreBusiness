name: CI/CD — CoreBusiness

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ──────────────────────────────────────────────────────────────────
# JOB 1 · CI — Compilar, testear y analizar calidad
# ──────────────────────────────────────────────────────────────────
jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write          # publicar resultados de tests
      pull-requests: write   # comentar cobertura en PRs

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout código fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # historial completo para análisis de calidad

      # ── Java 21 + caché Maven ──────────────────────────────────
      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      # ── Compilar (sin ejecutar tests) ─────────────────────────
      - name: Compilar proyecto
        run: ./mvnw -B compile --file pom.xml -q

      # ── Tests unitarios e integración ─────────────────────────
      # H2 cubre DataJpaTest; no se necesitan servicios externos
      - name: Ejecutar suite de tests
        run: ./mvnw -B test --file pom.xml -Dspring.profiles.active=test

      # ── Publicar resultados de tests en GitHub ─────────────────
      - name: Publicar resultados de tests
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true

      # ── Subir reporte Surefire como artefacto ─────────────────
      - name: Subir reporte Surefire
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      # ── Package JAR (skip tests, ya corrieron) ────────────────
      - name: Empaquetar JAR
        run: ./mvnw -B package --file pom.xml -DskipTests -q

      # ── Subir JAR como artefacto de build ────────────────────
      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: corebusiness-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

      # ── Actualizar grafo de dependencias (Dependabot) ─────────
      - name: Actualizar grafo de dependencias
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'

  # ──────────────────────────────────────────────────────────────────
  # JOB 2 · Docker — Construir y publicar imagen en GHCR
  # Solo en push a main (no en PRs)
  # ──────────────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write    # push a GitHub Container Registry

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      # ── Descargar JAR generado por el job ci ─────────────────
      - name: Descargar JAR
        uses: actions/download-artifact@v4
        with:
          name: corebusiness-jar
          path: target/

      # ── Metadatos de la imagen ────────────────────────────────
      - name: Extraer metadatos Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=true
            type=ref,event=branch

      # ── Login a GitHub Container Registry ─────────────────────
      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Buildx para multi-platform o cache avanzado ───────────
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build y push ──────────────────────────────────────────
      - name: Build y push imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────
  # JOB 3 · CD — Deploy a producción (Railway / Render / VPS)
  # Se activa solo en push a main, después de que la imagen esté lista
  # ──────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ vars.APP_URL }}     # variable de entorno en Settings → Environments

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      # ── Notificación de inicio de deploy ──────────────────────
      - name: Notificar inicio de deploy
        run: |
          echo "🚀 Iniciando deploy de CoreBusiness"
          echo "Commit: ${{ github.sha }}"
          echo "Actor:  ${{ github.actor }}"

      # ── Deploy en VPS via SSH ──────────────────────────────────
      - name: Deploy en VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "📦 Pulling imagen más reciente..."
            docker pull ghcr.io/${{ github.repository }}:latest

            echo "🔄 Reiniciando servicio..."
            cd /opt/corebusiness
            docker compose up -d --force-recreate

            echo "🧹 Limpiando imágenes antiguas..."
            docker image prune -f

            echo "✅ Deploy completado — CoreBusiness corriendo"
            docker ps --filter "name=corebusiness"
