spring.application.name=CoreBusiness

# Puerto del servidor
server.port=8080

# Conexión a Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_math}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# Deshabilitar docker-compose automático para priorizar la instancia PostgreSQL existente
spring.docker.compose.enabled=false

# Endpoints de Actuator (Health & Metrics para Microservicios)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Configuración Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Logging con Correlation ID
logging.pattern.level=%5p [%X{correlationId:-N/A}]

# Configuración JWT (Spring Security & OAuth2 Resource Server)
jwt.issuer=corebusiness-auth
jwt.audience=corebusiness-api
jwt.access-token-expiration-minutes=15
jwt.refresh-token-expiration-days=7
# Clave secreta HMAC-SHA256 de al menos 256 bits (32 bytes en hex)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
